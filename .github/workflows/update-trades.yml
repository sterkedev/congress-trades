name: Update congress trades

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (08:17 Belgian summer time)
  workflow_dispatch: {}    # adds a "Run workflow" button for manual runs

permissions:
  contents: write          # needed to save the updated data files back to the repo

concurrency:
  group: update-trades
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Collect new filings
        working-directory: pipeline
        run: python run.py

      - name: Save data to the repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update trades $(date -u +%Y-%m-%d)"
            git push
          fi
